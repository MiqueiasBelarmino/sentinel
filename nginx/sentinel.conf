# /etc/nginx/sites-available/sentinel
#
# Instruções de ativação na VPS:
#   cp /root/apps/sentinel/nginx/sentinel.conf /etc/nginx/sites-available/sentinel
#   ln -s /etc/nginx/sites-available/sentinel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Após apontar o DNS (registro A: sentinel → IP da VPS):
#   certbot --nginx -d sentinel.entregahub.com.br

server {
    listen 443 ssl;
    server_name sentinel.entregahub.com.br;

    # SSL — preenchido pelo Certbot automaticamente após o comando acima
    ssl_certificate /etc/letsencrypt/live/sentinel.entregahub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinel.entregahub.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend React (build estático)
    location / {
        root /root/apps/sentinel/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend Express (proxy)
    location /api/ {
        proxy_pass http://localhost:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name sentinel.entregahub.com.br;

    if ($host = sentinel.entregahub.com.br) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
